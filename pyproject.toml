[project]
name = "spoider"
version = "0.3.13"
description = "A TUI mind map editor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=1.0,<7"]

[project.scripts]
spoider = "spoider.app:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-xdist>=3,<4",
    "ruff>=0.14,<1",
    "pyright>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spoider"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One test drives one app through its message loop, so the suite waits far more than
# it computes: serially, 56 s of wall clock on 10 s of CPU. Workers past the core
# count fill that waiting instead of fighting over it, and the curve is flat from
# about twice the cores until it turns up again at four times — the number barely
# matters between 12 and 24. `-n 0` runs them serially, under a debugger.
addopts = "-n 12"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
