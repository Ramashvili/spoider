[project]
name = "spoider"
version = "0.1.0"
description = "A TUI mind map editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=1.0,<7"]

[project.scripts]
spoider = "spoider.app:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spoider"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
