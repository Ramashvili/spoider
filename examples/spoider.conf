# spoider — editor settings
#
# One setting per line. Text after # is a comment, so a line that starts
# with # is doing nothing.

# the version of spoider that wrote this file; a later one reads it to migrate
created_by = 0.4.13

# true or false: save after every edit, and when quitting
autosave = false
# the marks a new map starts with, in order; one glyph each, up to 64; a saved
# map keeps its own, which set_marks (^W by default) sets in the editor
marks_default = ⭐ 💡 ❓ ⚠️ ✅ 📌 ⌛ 🤡
# the column width ^J wraps to by default; a whole number, 10 to 400
justify_width_default = 40
# how wide a tab is drawn in a cell: the next stop of this many cells; 1 to 16
tab_width = 4
# how far PgUp and PgDn move inside a cell; a whole number, 1 to 200
page_lines = 10
# true or false: hide the bar of keys along the bottom
hide_footer = false
# true or false: whether the first-run question about .spoider was answered
desktop_asked = false

# Chords. An action can have more than one chord: they are separated by a
# space. Uncomment a line to change it.

# add a child and type its name
# add_child = tab

# select every sibling of the selected cell
# select_all = ctrl+a

# add a sibling after the selection
# add_sibling = enter

# reflow the cell's text to a width you type
# justify = ctrl+j

# copy the cell's text to the clipboard
# copy = alt+6

# rename the selected cell in place
# edit = e ctrl+e

# cut the cells into a LIFO stack, to paste back anywhere
# cut = ctrl+k

# paste the newest cut; the older ones stay on the stack
# paste = ctrl+u

# open the cut stack: its keys are the map's own
# toggle_stack = p

# delete the cell and everything under it
# delete = ctrl+d delete

# the file's properties, drawn over the map
# toggle_properties = , `

# fold or unfold the branch
# fold = t ctrl+t

# cycle the mark, then off
# mark = w

# set the marks this map cycles, in order
# set_marks = ctrl+w

# find cells by their words, in the map and on the stack
# search = ctrl+f

# the next or previous hit, wrapping; the panel opens for a cut
# next_match = alt+f

# the next or previous hit, wrapping; the panel opens for a cut
# previous_match = alt+b

# the editor's settings, opened in your editor
# settings = . f9

# this help
# help = ? f1

# previous sibling
# go_up = up ctrl+p k

# next sibling
# go_down = down ctrl+n j

# the main cell of this tree
# go_home = home

# the deepest cell below this one
# go_end = end

# the first sibling under the same parent
# top_sibling = pageup

# the last sibling under the same parent
# bottom_sibling = pagedown

# left: out to parent, or deeper on a left branch
# go_left = left ctrl+b h

# right: the mirror of the above
# go_right = right l

# hold shift and an arrow: select a run of siblings
# extend_prev = shift+up

# hold shift and an arrow: select a run of siblings
# extend_next = shift+down

# hold shift and an arrow: select a run of siblings
# extend_left = shift+left

# hold shift and an arrow: select a run of siblings
# extend_right = shift+right

# back to a single cell, without moving
# clear_selection = escape

# move the cell up among its siblings
# move_up = alt+up

# move it down
# move_down = alt+down

# more air between cells, saved with the map
# spacing_more = =

# less air, down to cells sharing a border row
# spacing_less = -

# write straight back to the current file
# save = ctrl+s f2

# write out: asks which file, so it saves as
# write = ctrl+o f12

# quit; asks y / n / esc if unsaved
# quit = ctrl+x f10

# undo the last edit
# undo = ctrl+z f3

# redo the last undone edit
# redo = ctrl+y

# cycle the shape: spider, branch right, branch left, pyramid, bush
# layout = ctrl+l

# colour by depth, or by family, one colour per branch
# colours = c

