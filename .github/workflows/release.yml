name: release

# A tag is the whole trigger: the release is built from what the tag points at, and never from a
# branch. Nothing here publishes: the release is created as a draft, so a copy can be checked
# against a build of the same tag on another machine before anyone can download it.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs. The job that runs the repository's own
# build script therefore holds no key to the repository.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # read the tag, nothing more
      id-token: write       # the attestation is signed by this run's short-lived identity
      attestations: write
    env:
      UV_PYTHON: "3.14.10"
    steps:
      # Actions are pinned to the commit a tag pointed at, because tags move and commits do not, and
      # dependabot bumps them. The token is not left behind in .git/config for the build script to
      # find: this job may read the repository and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv python install 3.14.10

      # a release named v0.5.13 that carries an archive answering 0.5.12 is a mistake worth stopping
      - name: the tag and the version have to agree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "pyproject.toml says $version, the tag says $GITHUB_REF_NAME" >&2
              exit 1
          fi

      # writes dist/spoider-<version>-pyc.pyz, the one file a release carries
      - run: ./scripts/build-pyz

      # says, in GitHub's own words and signed by the run rather than by a person, which workflow,
      # which commit and which repository produced these bytes. `gh attestation verify <file>
      # --repo Ramashvili/spoider` checks it without anyone needing a key of mine.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/spoider-*-pyc.pyz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: archive
          path: dist/spoider-*-pyc.pyz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the draft release and put the file in it
    steps:
      # the whole history, because the tag object is what carries the release notes; no credentials
      # are left behind and no code from the repository runs in this job
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: archive
          path: dist

      # The body is the tag's own annotation, so what a reader sees on the release page is what the
      # person who signed the tag wrote there, once, instead of a second telling that can disagree
      # with it. The hash follows it: that is what a build of the same tag elsewhere is compared
      # against, and the archive gains its detached signature before the draft is published. The
      # signature, not the hash, is what a reader is meant to trust.
      - name: draft release with the tag's notes, the archive and its hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
              git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
              echo
              echo "Built from \`$GITHUB_SHA\` by the release workflow."
              echo
              echo "The signature over this file is the claim. The hash below is for comparing with a"
              echo "build of your own, and anyone can compute one."
              echo
              echo '```'
              (cd dist && sha256sum spoider-*-pyc.pyz)
              echo '```'
          } > "$RUNNER_TEMP/notes.md"
          # a signed tag carries its signature after the message; the body should not include it, and
          # a release page full of ASCII armour would say so loudly, so check rather than assume
          if grep -q "BEGIN PGP SIGNATURE" "$RUNNER_TEMP/notes.md"; then
              echo "the tag's signature reached the notes; write the notes from the body alone" >&2
              exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/spoider-*-pyc.pyz \
              --draft --verify-tag --title "spoider ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
