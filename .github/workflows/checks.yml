name: checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # pinned: setup-uv publishes no floating v10 tag, so both are pinned to the
      # version they were tested with and dependabot moves them
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --dev
      - run: uv run ruff check src tests
      - run: uv run pyright src/spoider
      - run: uv run pytest -q
